# Experiment config: EdNet-KT1, 10,000-student sample, WITH time features.
name: ednet
description: >-
  EdNet-KT1 sample with real timestamps, so the time-since-practice features
  (log_secs_since_concept, log_secs_since_any) are included.
dataset: ednet
seed: 42
split:
  val_frac: 0.15
  test_frac: 0.15
features:
  use_time: true

models:
  prior: {}
  heuristic: {}
  logistic_regression:
    C: [0.01, 0.1, 1.0, 10.0]
  gradient_boosting:
    learning_rate: [0.05, 0.1]
    max_leaf_nodes: [15, 31, 63]
  bkt: {}

selection:
  metric: log_loss
  max_ece: 0.05
  max_latency_ms_50_candidates: 50
  exclude: [prior]

evaluation:
  bootstrap_reps: 200
  reference_model: heuristic
