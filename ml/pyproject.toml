[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mentorx-ml"
version = "0.1.0"
description = "MENTORX knowledge-tracing pipeline: features, models, evaluation."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
boost = ["xgboost>=2.1"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["mentorx_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
