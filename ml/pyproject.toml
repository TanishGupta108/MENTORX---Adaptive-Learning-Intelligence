[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mentorx-ml"
version = "0.1.0"
description = "MENTORX knowledge-tracing pipeline: features, models, evaluation."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pyyaml>=6.0",
  "pyarrow>=17",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
boost = ["xgboost>=2.1"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["mentorx_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Report templates: long Markdown lines are clearer than split strings.
"scripts/eda.py" = ["E501"]
"scripts/evaluate.py" = ["E501"]
"scripts/compare.py" = ["E501"]
"scripts/time_response.py" = ["E501"]
