[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mentorx-ml"
version = "0.1.0"
description = "MENTORX knowledge-tracing pipeline: features, models, evaluation."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  # Exact pin: saved models (joblib) must be loaded by the same scikit-learn version.
  "scikit-learn==1.9.1",
  "joblib>=1.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
boost = ["xgboost>=2.1"]
# Needed by the data/EDA/training scripts, not by the backend at serving time.
analysis = ["pyarrow>=17", "matplotlib>=3.9"]
# Deep knowledge tracing: training notebook and scripts/export_kt.py (not needed for serving).
dl = ["torch>=2.4"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["mentorx_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# Notebooks are exploratory records of what was run; scripts and the package are linted.
extend-exclude = ["notebooks"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Report templates: long Markdown lines are clearer than split strings.
"scripts/eda.py" = ["E501"]
"scripts/evaluate.py" = ["E501"]
"scripts/compare.py" = ["E501"]
"scripts/time_response.py" = ["E501"]
"scripts/export_model.py" = ["E501"]
