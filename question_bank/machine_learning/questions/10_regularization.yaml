questions:
  - id: reg-001
    concept: ml.regularization
    difficulty: 2
    diagnostic: true
    stem: Which type of regularisation tends to set some weights to exactly zero?
    options:
      A: L2 (ridge)
      B: L1 (lasso)
      C: Both equally
      D: Neither
    answer: B
    explanation: The L1 penalty has a sharp corner at zero, so the optimum often lands exactly on zero for some weights, which performs feature selection. L2 shrinks weights towards zero but rarely makes them exactly zero.

  - id: reg-002
    concept: ml.regularization
    difficulty: 1
    stem: What does L1 or L2 regularisation add to the loss function?
    options:
      A: The number of training examples
      B: A random noise term
      C: A penalty that grows with the size of the weights
      D: The validation error
    answer: C
    explanation: The regularised loss is training loss + λ × (penalty on weights). That discourages large weights and therefore overly complex models.

  - id: reg-003
    concept: ml.regularization
    difficulty: 1
    stem: What is the main purpose of regularisation?
    options:
      A: To reduce overfitting
      B: To make training faster
      C: To increase training accuracy
      D: To remove the need for a test set
    answer: A
    explanation: Regularisation limits model complexity so that it generalises better. It usually increases training error slightly in exchange for lower test error.

  - id: reg-004
    concept: ml.regularization
    difficulty: 1
    stem: Which penalty does ridge (L2) regression add to the loss?
    options:
      A: λ × Σ|wᵢ|
      B: λ × (number of non-zero weights)
      C: λ × max(wᵢ)
      D: λ × Σ wᵢ²
    answer: D
    explanation: Ridge penalises the sum of squared weights. The sum of absolute values, λΣ|wᵢ|, is the L1 (lasso) penalty.

  - id: reg-005
    concept: ml.regularization
    difficulty: 1
    stem: What happens if you make the regularisation strength λ very large?
    options:
      A: The model overfits more
      B: The weights shrink towards zero and the model underfits
      C: The weights become very large
      D: Nothing changes
    answer: B
    explanation: A huge penalty forces the weights close to zero, so the model becomes too simple (high bias). λ has to be balanced, usually with cross-validation.

  - id: reg-006
    concept: ml.regularization
    difficulty: 2
    stem: What model do you get if you set λ = 0 in ridge regression?
    options:
      A: A model with all weights equal to zero
      B: Lasso regression
      C: Ordinary (unregularised) linear regression
      D: Logistic regression
    answer: C
    explanation: With λ = 0 the penalty disappears and ridge reduces to plain least squares.

  - id: reg-007
    concept: ml.regularization
    difficulty: 2
    stem: Is the bias (intercept) term usually regularised?
    options:
      A: Usually not, because it only shifts predictions and doesn't add model complexity
      B: Always, with a stronger penalty than the other weights
      C: Only in lasso
      D: Only when the data is unscaled
    answer: A
    explanation: Penalising the intercept would pull predictions towards zero for no good reason, for example making a house-price model under-predict. Libraries like scikit-learn don't penalise the intercept by default.

  - id: reg-008
    concept: ml.regularization
    difficulty: 2
    stem: Why should you scale features before applying L1 or L2 regularisation?
    options:
      A: Regularisation only works on integer features
      B: Scaling removes the need to choose λ
      C: Scaling makes the model non-linear
      D: The penalty treats all weights the same, so a feature's units would otherwise change how strongly it's penalised
    answer: D
    explanation: A feature in rupees needs a tiny weight, while the same feature in lakhs needs a large one, so an unscaled model penalises them very differently. Standardising features makes the penalty fair.

  - id: reg-009
    concept: ml.regularization
    difficulty: 2
    stem: What is early stopping?
    options:
      A: Stopping training as soon as training loss starts falling
      B: Stopping training when validation error stops improving
      C: Training for exactly one epoch
      D: Stopping when the test accuracy is highest
    answer: B
    explanation: Early stopping monitors a validation set and stops (or keeps the best checkpoint) when validation error starts rising, which acts like regularisation. Using the test set for this would leak it into model selection.

  - id: reg-010
    concept: ml.regularization
    difficulty: 2
    stem: What is the correct way to choose the regularisation strength λ?
    options:
      A: Pick the λ with the best test-set score
      B: Always use λ = 1
      C: Use cross-validation (or a validation set) on the training data
      D: Choose the λ that gives the lowest training error
    answer: C
    explanation: λ is a hyperparameter, so it's tuned on validation data. The lowest training error is always at λ = 0, and tuning on the test set makes the final estimate optimistic.

  - id: reg-011
    concept: ml.regularization
    difficulty: 3
    stem: What is elastic net regularisation?
    options:
      A: L1 regularisation applied twice
      B: Dropout for linear models
      C: A penalty on the largest weight only
      D: A mix of L1 and L2 penalties, which keeps some sparsity while handling correlated features better than L1 alone
    answer: D
    explanation: Elastic net adds α·L1 + (1 − α)·L2. Lasso tends to pick one feature from a correlated group arbitrarily, and the L2 part lets elastic net share weight among them.

  - id: reg-012
    concept: ml.regularization
    difficulty: 3
    stem: What is the closed-form solution for ridge regression, and what side benefit does it have?
    options:
      A: w = (XᵀX)⁻¹Xᵀy, which is always invertible
      B: w = (XᵀX + λI)⁻¹Xᵀy, and adding λI makes the matrix invertible even when features are collinear
      C: w = Xᵀy / λ, which needs no matrix inverse
      D: Ridge has no closed-form solution
    answer: B
    explanation: Adding λI (λ > 0) makes XᵀX + λI positive definite, so it can always be inverted. That fixes the singular-matrix problem caused by collinear features.

  - id: reg-013
    concept: ml.regularization
    difficulty: 3
    stem: From a Bayesian point of view, what does L2 regularisation correspond to?
    options:
      A: A Gaussian (normal) prior on the weights, using MAP estimation
      B: A uniform prior on the weights
      C: A Laplace prior on the weights
      D: No prior at all
    answer: A
    explanation: Maximising likelihood × Gaussian prior gives the squared-weight penalty. A Laplace prior gives the L1 penalty, and a flat prior gives plain maximum likelihood.

  - id: reg-014
    concept: ml.regularization
    difficulty: 2
    test_form: A
    stem: You increase the ridge penalty λ from 0.01 to 100. What typically happens to the training error?
    options:
      A: It decreases
      B: It increases
      C: It stays exactly the same
      D: It becomes negative
    answer: B
    explanation: A stronger penalty restricts the weights, so the model fits the training data less closely and training error goes up. The hope is that validation error goes down, at least up to a point.

  - id: reg-015
    concept: ml.regularization
    difficulty: 2
    test_form: B
    stem: You increase the lasso penalty λ. What typically happens to the number of non-zero weights?
    options:
      A: It increases
      B: It decreases or stays the same
      C: It always stays the same
      D: It becomes equal to the number of examples
    answer: B
    explanation: A stronger L1 penalty pushes more weights to exactly zero, so the model uses fewer features. At very large λ every weight becomes zero.
