questions:
  - id: prob-001
    concept: ml.probability
    difficulty: 2
    review_status: reviewed
    diagnostic: true
    stem: Events A and B are independent, with P(A) = 0.5 and P(B) = 0.4. What is P(A and B)?
    options:
      A: "0.2"
      B: "0.9"
      C: "0.1"
      D: "0.45"
    answer: A
    explanation: For independent events, P(A and B) = P(A) × P(B) = 0.5 × 0.4 = 0.2. Adding them (0.9) is the wrong rule. Addition applies to "or" for mutually exclusive events.

  - id: prob-002
    concept: ml.probability
    difficulty: 1
    review_status: reviewed
    stem: You roll a fair six-sided die. What is the probability of getting an even number?
    options:
      A: 1/6
      B: 1/3
      C: 1/2
      D: 2/3
    answer: C
    explanation: Three of the six equally likely outcomes (2, 4, 6) are even, so the probability is 3/6 = 1/2.

  - id: prob-003
    concept: ml.probability
    difficulty: 1
    review_status: reviewed
    stem: For a discrete probability distribution, what do the probabilities of all possible outcomes add up to?
    options:
      A: "0"
      B: "100"
      C: It depends on the distribution
      D: "1"
    answer: D
    explanation: Some outcome must happen, so the probabilities of all outcomes always sum to exactly 1 (100% only if you write them as percentages).

  - id: prob-004
    concept: ml.probability
    difficulty: 1
    review_status: reviewed
    stem: What is the expected value of one roll of a fair six-sided die?
    options:
      A: "3.5"
      B: "3"
      C: "6"
      D: "21"
    answer: A
    explanation: E[X] = (1 + 2 + 3 + 4 + 5 + 6) / 6 = 21 / 6 = 3.5. The expected value doesn't have to be a value the die can show.

  - id: prob-005
    concept: ml.probability
    difficulty: 1
    review_status: reviewed
    stem: What does the variance of a random variable measure?
    options:
      A: Its most likely value
      B: How spread out its values are around the mean
      C: The probability that it equals zero
      D: Its largest possible value
    answer: B
    explanation: Variance is the expected squared distance from the mean, E[(X − μ)²]. A larger variance means values are more spread out. The most likely value is the mode.

  - id: prob-006
    concept: ml.probability
    difficulty: 2
    review_status: reviewed
    stem: How is the conditional probability P(A | B) defined (for P(B) > 0)?
    options:
      A: P(A) × P(B)
      B: P(B | A) × P(A)
      C: P(A and B) / P(B)
      D: P(A) + P(B)
    answer: C
    explanation: P(A | B) is the probability of A within the world where B happened, P(A and B) / P(B). P(A) × P(B) equals P(A and B) only when A and B are independent.

  - id: prob-007
    concept: ml.probability
    difficulty: 2
    review_status: reviewed
    stem: Which formula is Bayes' theorem?
    options:
      A: P(A | B) = P(A) + P(B)
      B: P(A | B) = P(A and B) × P(B)
      C: P(A | B) = P(B | A)
      D: P(A | B) = P(B | A) × P(A) / P(B)
    answer: D
    explanation: Bayes' theorem reverses a conditional probability using the prior P(A) and the evidence P(B). P(A | B) and P(B | A) are generally different, which is a common mistake.

  - id: prob-008
    concept: ml.probability
    difficulty: 2
    review_status: reviewed
    stem: For a normal distribution, roughly what fraction of values lies within one standard deviation of the mean?
    options:
      A: About 68%
      B: About 50%
      C: About 95%
      D: About 99.7%
    answer: A
    explanation: The 68–95–99.7 rule says about 68% lie within 1σ, 95% within 2σ and 99.7% within 3σ.

  - id: prob-009
    concept: ml.probability
    difficulty: 2
    review_status: reviewed
    stem: In maximum likelihood estimation (MLE), what is maximised?
    options:
      A: The number of parameters
      B: The probability of the observed data given the parameters
      C: The probability of the parameters being exactly right
      D: The variance of the predictions
    answer: B
    explanation: MLE picks the parameters θ that make the observed data most probable, maximising P(data | θ). The probability of the parameters given the data is what Bayesian (MAP) estimation works with.

  - id: prob-010
    concept: ml.probability
    difficulty: 2
    review_status: reviewed
    stem: A Bernoulli random variable has P(X = 1) = 0.3. What is its variance?
    options:
      A: "0.3"
      B: "0.09"
      C: "0.21"
      D: "0.7"
    answer: C
    explanation: For a Bernoulli(p) variable, Var(X) = p(1 − p) = 0.3 × 0.7 = 0.21. 0.3 is the mean, and 0.09 is p².

  - id: prob-011
    concept: ml.probability
    difficulty: 3
    review_status: reviewed
    stem: A disease affects 1% of people. A test detects 90% of true cases, but also gives a positive result for 9% of healthy people. Someone tests positive. Roughly how likely is it that they have the disease?
    options:
      A: About 90%
      B: About 50%
      C: About 1%
      D: About 9%
    answer: D
    explanation: P(disease | +) = 0.9×0.01 / (0.9×0.01 + 0.09×0.99) = 0.009 / 0.0981 ≈ 9%. The disease is rare, so most positives come from the large healthy group. Answering 90% confuses P(+ | disease) with P(disease | +).

  - id: prob-012
    concept: ml.probability
    difficulty: 3
    review_status: reviewed
    stem: Two variables have a correlation of exactly 0. Which statement is true?
    options:
      A: They have no linear relationship, but they can still be dependent
      B: They must be independent
      C: One of them must be constant
      D: Their covariance is 1
    answer: A
    explanation: Correlation only measures linear association. For example, if X is symmetric around 0 and Y = X², their correlation is 0 even though Y is completely determined by X.

  - id: prob-013
    concept: ml.probability
    difficulty: 3
    review_status: reviewed
    stem: You add up n independent Bernoulli(p) random variables. What distribution does the sum follow?
    options:
      A: Normal(p, 1)
      B: Binomial(n, p)
      C: Uniform(0, n)
      D: Bernoulli(n × p)
    answer: B
    explanation: The sum counts successes in n independent trials with success probability p, which is the definition of a Binomial(n, p) variable. It only approaches a normal shape for large n.

  - id: prob-014
    concept: ml.probability
    difficulty: 2
    review_status: reviewed
    test_form: A
    stem: Events A and B are independent, with P(A) = 0.6 and P(B) = 0.5. What is P(A and B)?
    options:
      A: "1.1"
      B: "0.1"
      C: "0.3"
      D: "0.55"
    answer: C
    explanation: For independent events, P(A and B) = P(A) × P(B) = 0.6 × 0.5 = 0.3. A probability can never be 1.1, which shows that adding is the wrong rule here.

  - id: prob-015
    concept: ml.probability
    difficulty: 2
    review_status: reviewed
    test_form: B
    stem: Events A and B are independent, with P(A) = 0.3 and P(B) = 0.4. What is P(A and B)?
    options:
      A: "0.12"
      B: "0.1"
      C: "0.35"
      D: "0.7"
    answer: A
    explanation: For independent events, P(A and B) = P(A) × P(B) = 0.3 × 0.4 = 0.12. 0.7 is the sum, which is the wrong rule for "and".
