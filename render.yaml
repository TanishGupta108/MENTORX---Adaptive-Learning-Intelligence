# Render Blueprint: the API (native Python, no Docker) + a managed PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# See docs/deployment.md for the full checklist.
services:
  - type: web
    name: mentorx-backend
    runtime: python
    # Built from the repository root: the API needs ml/ (shared feature code) and
    # question_bank/ next to backend/. Editable install, so the backend finds the question
    # bank and the model files relative to its own source.
    buildCommand: pip install --upgrade pip && pip install ./ml && pip install -e ./backend
    # Migrate, load the question bank (idempotent), serve on $PORT.
    startCommand: cd backend && sh scripts/start.sh
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION  # the version CI tests with
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mentorx-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: strict
      # The Vercel URL, e.g. https://mentorx.vercel.app (requests normally arrive through
      # Vercel's same-origin rewrite, so CORS is a second line of defence).
      - key: CORS_ORIGINS
        sync: false
      # Leave unset for production behaviour (only reviewed questions). Set to "true" ONLY
      # for a supervised demo before the question bank has been reviewed.
      - key: SEED_INCLUDE_DRAFTS
        sync: false
      # The pilot study (docs/modules/pilot.md). Change these in the Render dashboard.
      - key: PILOT_ACTIVE
        value: "false"
      - key: POSTTEST_OPEN
        value: "false"
      # Comma-separated emails of the study team: they get the Study page and data exports.
      - key: ADMIN_EMAILS
        sync: false
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: mentorx-db
    plan: free
    region: singapore
    databaseName: mentorx
    user: mentorx
