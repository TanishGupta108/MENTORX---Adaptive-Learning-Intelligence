# Render Blueprint: the API (Docker) + a managed PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# See docs/deployment.md for the full checklist.
services:
  - type: web
    name: mentorx-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mentorx-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: strict
      # The Vercel URL, e.g. https://mentorx.vercel.app (requests normally arrive through
      # Vercel's same-origin rewrite, so CORS is a second line of defence).
      - key: CORS_ORIGINS
        sync: false
      # Leave unset for production behaviour (only reviewed questions). Set to "true" ONLY
      # for a supervised demo before the question bank has been reviewed.
      - key: SEED_INCLUDE_DRAFTS
        sync: false
      - key: PILOT_ACTIVE
        value: "false"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: mentorx-db
    plan: free
    region: singapore
    databaseName: mentorx
    user: mentorx
