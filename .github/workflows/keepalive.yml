# Keeps the API awake. Render's free plan puts a web service to sleep after about 15 minutes
# without traffic, and the next visitor then waits about a minute while it starts. A cheap
# health check every 10 minutes keeps it warm. (Free for public repositories. GitHub may run
# scheduled jobs a few minutes late, and disables them after 60 days without any repository
# activity: re-enable from the Actions tab if that happens.)
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the API health endpoint
        run: |
          curl --fail --silent --show-error --max-time 100 --retry 3 --retry-delay 10 \
            https://mentorx-backend-uco2.onrender.com/api/v1/health
