name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://mentorx:mentorx@localhost:5432/mentorx
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL comes preinstalled on GitHub's Ubuntu runners (no containers).
      - name: Start PostgreSQL
        working-directory: .
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost; do sleep 1; done
          sudo -u postgres psql -c "CREATE ROLE mentorx LOGIN SUPERUSER PASSWORD 'mentorx'"
          sudo -u postgres createdb -O mentorx mentorx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/pyproject.toml
      # The backend imports the shared feature code from ml/ (design decision D-3).
      - run: pip install -e ../ml -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing

  # Installs the API exactly as Render does (render.yaml buildCommand), starts it in
  # production mode with the same start script, and runs the end-to-end smoke test against
  # a real Postgres: migrations, seeding, model loading and the full student flow.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL comes preinstalled on GitHub's Ubuntu runners (no containers).
      - name: Start PostgreSQL
        working-directory: .
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost; do sleep 1; done
          sudo -u postgres psql -c "CREATE ROLE mentorx LOGIN SUPERUSER PASSWORD 'mentorx'"
          sudo -u postgres createdb -O mentorx mentorx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/pyproject.toml
      - name: Install like Render (non-editable ml, editable backend)
        run: pip install --upgrade pip && pip install ./ml && pip install -e ./backend
      - name: Start the API in production mode
        working-directory: backend
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgres://mentorx:mentorx@localhost:5432/mentorx
          COOKIE_SECURE: "true"
          PORT: "8000"
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          nohup sh scripts/start.sh > ../api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:8000/api/v1/health/ready && break
            sleep 2
          done
      - run: python backend/scripts/smoke.py http://127.0.0.1:8000
      - if: always()
        run: cat api.log

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e ".[dev,analysis]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
