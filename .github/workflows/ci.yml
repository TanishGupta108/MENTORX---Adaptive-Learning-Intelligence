name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mentorx
          POSTGRES_PASSWORD: mentorx
          POSTGRES_DB: mentorx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mentorx" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mentorx:mentorx@localhost:5432/mentorx
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/pyproject.toml
      # The backend imports the shared feature code from ml/ (design decision D-3).
      - run: pip install -e ../ml -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e ".[dev,analysis]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
